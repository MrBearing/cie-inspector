name: Release

# Publishing a GitHub Release is the trigger: draft it, review the notes,
# press Publish, and this ships the same commit to PyPI. `workflow_dispatch`
# is there to rehearse against TestPyPI without cutting a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: astral-sh/setup-uv@v5

      # A tag that disagrees with pyproject.toml would publish a version
      # nobody asked for, and PyPI never lets that number be reused.
      - name: Tag must match the project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${TAG#v}"
          project="$(uv version --short)"
          echo "tag=$tag project=$project"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag ${TAG} does not match the version in pyproject.toml (${project})"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Clone demo_nodes_cpp for smoke test
        run: git clone --depth 1 --branch humble https://github.com/ros2/demos /tmp/ros2_demos
      - name: Test
        run: uv run pytest -q
        env:
          CIE_DEMO_NODES_CPP: /tmp/ros2_demos

      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      # Publish exactly what was tested, rather than rebuilding downstream.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing; no token is stored anywhere
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.target == 'pypi'
        run: uv publish --trusted-publishing always

  attach-artifacts:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attach the built files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
