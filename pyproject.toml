[project]
name = "cie-inspector"
version = "0.1.0"
description = "Extract ROS 2 callback/CallbackGroup structure from source code — no build, no ROS required"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.scripts]
cie-inspector = "cie_inspector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "syrupy>=4.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cie_inspector"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
